<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ship Commander · Admin</title>
<style>
/* Estética GuildSwarm × Ship Commander (handoff): tokens replicados inline
   porque admin.html es autocontenido (sin importar index.css ni assets). */
:root{
  --void:#171227; --void-soft:#201e2f;
  --gold:#908d48; --gold-deep:#89842d; --gold-bright:#ffc619; --gold-soft:#ffe75c;
  --green:#29cc7a; --red:#9b3935; --red-bright:#ff5a55; --blue-soft:#66bcff;
  --rule:#d9d9d9; --grey-2:#b9bbbe; --grey-3:#74767d;
  --radius:7px;
  --ease:cubic-bezier(0.2,0.7,0.2,1);
  --panel-bg:rgba(35,35,35,.6); --panel-border:rgba(217,217,217,.12);
  --shadow-card:0 4px 4px rgba(0,0,0,.25);
  --font-body:"Nunito Sans","Helvetica Neue",system-ui,sans-serif;
  --font-mono:ui-monospace,"JetBrains Mono","SF Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 620px at 50% -10%, rgba(255,198,25,.06), transparent 60%),
    var(--void);
  color:#fff; font-family:var(--font-body);
  padding:34px clamp(20px,4vw,56px) 0; max-width:1300px; margin:0 auto;
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
header{margin-bottom:24px}
h1{font-weight:900;font-size:1.7rem;letter-spacing:.04em;color:var(--gold-bright);
  text-shadow:0 0 24px rgba(255,198,25,.4),0 0 2px rgba(255,198,25,.6)}
.sub{margin-top:6px;color:var(--grey-3);font-size:.72rem;font-weight:800;
  text-transform:uppercase;letter-spacing:.26em}

/* Tabs */
.tabbar{display:flex;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.tabbar button{background:rgba(0,0,0,.4);border:1px solid rgba(217,217,217,.15);
  color:var(--grey-2);padding:10px 22px;border-radius:var(--radius);
  font-weight:700;letter-spacing:.04em;transition:.2s var(--ease)}
.tabbar button:hover{border-color:var(--gold);color:#fff}
.tabbar button.active{border-color:var(--gold-bright);background:rgba(255,198,25,.08);
  color:var(--gold-bright);box-shadow:0 0 14px rgba(255,198,25,.2)}

.tab{display:none}
.tab.active{display:block}
/* General: dos columnas de parámetros (cada grupo se mantiene íntegro) */
#tabGeneral.active{columns:2;column-gap:28px}
@media(max-width:900px){#tabGeneral.active{columns:1}}

/* Panel / grupo */
.group{background:var(--panel-bg);border:1px solid var(--panel-border);
  border-radius:var(--radius);box-shadow:var(--shadow-card);
  padding:18px 20px;margin-bottom:24px;break-inside:avoid}
.group h2{color:var(--gold);font-size:.72rem;font-weight:800;letter-spacing:.28em;
  text-transform:uppercase;margin-bottom:14px;padding-bottom:10px;
  border-bottom:1px solid rgba(217,217,217,.1)}

/* Campo */
.field{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.field label{flex:1;min-width:0;font-size:.84rem;color:var(--grey-2)}
.field input[type=number],.field input[type=text]{background:rgba(0,0,0,.45);
  border:1px solid rgba(217,217,217,.2);color:#fff;padding:7px 10px;width:110px;
  font:inherit;font-size:.85rem;border-radius:var(--radius);transition:.2s var(--ease)}
.field input[type=text].wide{flex:2;width:auto;min-width:0}
.field input:focus{outline:none;border-color:var(--gold-bright);
  box-shadow:0 0 0 1px var(--gold-bright)}
.field input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold-bright);cursor:pointer}
.field .unit{color:var(--grey-3);font-size:.72rem;width:120px;flex:none}

/* Naves */
.shipcard{background:var(--panel-bg);border:1px solid var(--panel-border);
  border-radius:var(--radius);box-shadow:var(--shadow-card);padding:18px 22px;margin-bottom:18px}
.shipcard h3{color:var(--gold-bright);font-size:1rem;font-weight:800;letter-spacing:.04em;margin-bottom:14px}
.shipcard h3 span{color:var(--grey-3);font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}

/* Oleadas */
.wave{display:flex;align-items:center;gap:14px;margin-bottom:10px;
  background:var(--panel-bg);border:1px solid var(--panel-border);
  border-radius:var(--radius);padding:10px 14px}
.wave .wlabel{color:var(--gold);width:96px;font-size:.78rem;font-weight:700;letter-spacing:.1em}
.wave input[type=text]{flex:1;background:rgba(0,0,0,.45);border:1px solid rgba(217,217,217,.2);
  color:#fff;padding:7px 10px;font:inherit;font-size:.85rem;border-radius:var(--radius);transition:.2s var(--ease)}
.wave input:focus{outline:none;border-color:var(--gold-bright);box-shadow:0 0 0 1px var(--gold-bright)}
.wave label.boss{font-size:.8rem;color:var(--gold-soft);display:flex;align-items:center;gap:6px;white-space:nowrap}
.wave label.boss input{accent-color:var(--gold-soft);width:16px;height:16px}
.wave button.del{background:transparent;border:1px solid rgba(155,57,53,.5);color:var(--red-bright);
  padding:6px 12px;border-radius:var(--radius)}
.wave button.del:hover{background:rgba(155,57,53,.12);border-color:var(--red)}

.note{color:var(--grey-3);font-size:.78rem;line-height:1.5;margin:0 0 16px}

/* Acciones (barra fija inferior) */
.actions{position:sticky;bottom:0;display:flex;gap:14px;align-items:center;
  padding:18px 0;margin-top:8px;border-top:1px solid rgba(217,217,217,.1);
  background:linear-gradient(0deg,var(--void) 72%,transparent)}

button{font:inherit;cursor:pointer;border-radius:var(--radius);transition:.2s var(--ease)}
#save{background:var(--gold-bright);border:1px solid var(--gold-bright);color:var(--void);
  font-weight:800;letter-spacing:.04em;padding:11px 28px}
#save:hover{background:var(--gold-soft);border-color:var(--gold-soft);box-shadow:0 0 24px var(--gold-bright)}
button.secondary{background:transparent;border:1px solid rgba(217,217,217,.2);color:var(--grey-2);padding:11px 22px}
button.secondary:hover{color:#fff;border-color:var(--gold)}

#status{font-size:.84rem;height:1.2em;font-weight:700}
.ok{color:var(--green)}.err{color:var(--red-bright)}
</style>
</head>
<body>
<header>
  <h1>Ship Commander</h1>
  <div class="sub">Panel Admin · todas las variables</div>
</header>

<div class="tabbar" id="tabbar"></div>
<div id="tabGeneral" class="tab active"></div>
<div id="tabShips"   class="tab"></div>
<div id="tabWaves"   class="tab"></div>

<div class="actions">
  <button id="save">Guardar todo</button>
  <button class="secondary" id="reset">Resetear defaults</button>
  <div id="status"></div>
</div>

<script>
// Grupos con etiqueta legible para escalares de nivel superior. Cualquier escalar
// que no esté aquí se vuelca automáticamente en "Otras variables", así TODO es editable.
const GROUPS = [
  ["Partida", {
    GAME_DURATION_S: ["Duración de partida", "segundos"],
    TEAM_LIVES:      ["Vidas de equipo (oleadas)", ""],
  }],
  ["Física de nave", {
    TURN_RATE:["Velocidad de giro","rad/tick"], THRUST:["Empuje adelante","px/tick²"],
    THRUST_FUEL:["Consumo empuje","/tick"], REVERSE_THRUST:["Empuje retroceso","px/tick²"],
    REVERSE_FUEL:["Consumo retroceso","/tick"], FUEL_REGEN:["Regeneración fuel","/tick"],
    DRAG:["Resistencia (drag)","0-1"],
  }],
  ["Balas", {
    BULLET_SPEED:["Velocidad","px/tick"], BULLET_COOLDOWN:["Cooldown","ticks"],
    BULLET_DAMAGE:["Daño","HP"], BULLET_RADIUS:["Radio de impacto","px"],
  }],
  ["Misiles", {
    MISSILE_SPEED_INIT:["Velocidad inicial","px/tick"], MISSILE_SPEED_MAX:["Velocidad máxima","px/tick"],
    MISSILE_COOLDOWN:["Cooldown","ticks"], MISSILE_LIFE:["Duración","ticks"],
    MISSILE_TURN:["Giro máximo/tick","rad/tick"], MISSILE_THRUST:["Aceleración","px/tick²"],
    MISSILE_DAMAGE:["Daño","HP"], MISSILE_RADIUS:["Radio impacto","px"], MISSILE_MAX_ACTIVE:["Máx simultáneos",""],
  }],
  ["Bengalas", {
    FLARE_LIFE:["Duración","ticks"], FLARE_COOLDOWN:["Cooldown","ticks"],
    FLARE_RADIUS:["Radio atracción","px"], FLARE_TURN:["Giro misil distraído","rad/tick"],
    FLARE_THRUST:["Empuje misil distraído","px/tick²"], FLARE_MAX_DEFAULT:["Bengalas por defecto","por vida"],
  }],
  ["Reaparición", {
    RESPAWN_DELAY:["Retardo reaparición","s"], RESPAWN_COUNT:["Reapariciones",""],
  }],
  ["IA / Dificultad (oleadas)", {
    AI_SPEED_MULT:["Velocidad IA","× (menor=+lento)"], AI_TURN_MULT:["Agilidad giro IA","× (menor=-esquivo)"],
    AI_AIM_JITTER:["Error puntería IA","rad (mayor=falla+)"], AI_FIRE_COOLDOWN_MULT:["Cadencia disparo IA","× (mayor=-)"],
    AI_LEAD_FACTOR:["Adelanto puntería","0-1 (1=predictivo)"], AI_FIRE_CONE:["Cono de disparo","rad (menor=preciso)"],
    AI_BULLET_RANGE:["Alcance cañón IA","px"], AI_MISSILE_CHANCE:["Prob. misil/tick","0-1"],
    AI_BOMBER_MISSILE_MULT:["× misil del bomber","×"], AI_FLARE_HEALTH_FRAC:["Umbral bengala","frac vida"],
    AI_REGROUP_HEALTH_FRAC:["Umbral huida","frac vida"], AI_PASS_DISTANCE:["Distancia de pasada","px"],
    AI_ATTACK_RUN_TIME:["Duración pasada","ms"], AI_DETECT_RANGE:["Radio detección","px (fuera→patrulla)"],
    AI_FORMATION_SPACING:["Separación formación","px"],
  }],
  ["Rayo Capital", {
    CAPITAL_BEAM_DAMAGE:["Daño","HP"], CAPITAL_BEAM_CHARGE_TIME:["Tiempo de carga","ticks"],
    CAPITAL_BEAM_RANGE:["Alcance","px"], CAPITAL_BEAM_HALFWIDTH:["Semianchura","px"],
    CAPITAL_BEAM_LIFE:["Vida efecto","ticks"], EMP_DURATION:["Duración chispas","ticks"],
  }],
  ["EMP (Disruptor)", {
    EMP_PULSE_RADIUS:["Radio pulso","px"], EMP_PULSE_COOLDOWN:["Cooldown","ticks"],
    EMP_DISABLE_MIN:["Apagado mín","ticks"], EMP_DISABLE_MAX:["Apagado máx","ticks"], EMP_PULSE_LIFE:["Vida onda","ticks"],
  }],
  ["Torpedos", {
    TORPEDO_DAMAGE:["Daño","HP"], TORPEDO_RADIUS:["Radio impacto","px"],
  }],
  ["Minas (Interceptor)", {
    MINE_COOLDOWN:["Cooldown","ticks"], MINE_MAX_ACTIVE:["Máx activas",""], MINE_ARM_TIME:["Tiempo de armado","ticks"],
    MINE_LIFE:["Vida","ticks"], MINE_TRIGGER_RADIUS:["Radio gatillo","px"], MINE_BLAST_RADIUS:["Radio explosión","px"],
    MINE_DAMAGE:["Daño","HP"],
  }],
  ["Torretas / Artilleros", {
    TURRET_DAMAGE:["Daño torreta","HP"], TURRET_COOLDOWN:["Cooldown torreta","ticks"], TURRET_BULLET_SPEED:["Vel. bala torreta","px/tick"],
    GUNNER_MISSILES:["Misiles artillero",""], GUNNER_MISSILE_COOLDOWN:["Cooldown misil artillero","ticks"],
    CAPITAL_GUNNER_MISSILES:["Misiles artillero Capital",""], CAPITAL_GUNNER_MISSILE_COOLDOWN:["Cooldown","ticks"],
  }],
  ["Asteroides", {
    ASTEROID_IMPACT_MIN:["Vel. mínima de daño","px/tick"], ASTEROID_DAMAGE_FACTOR:["Factor de daño","×"],
  }],
  ["Audio", {
    VOL_MASTER:["Volumen master","0-1"], VOL_MUSIC:["Volumen música","0-1"],
  }],
];

// Etiquetas legibles para los campos de cada nave
const SHIP_FIELD_LABELS = {
  label:"Nombre", desc:"Descripción", maxHp:"HP máximo", thrustMult:"× Empuje", turnMult:"× Giro",
  dragVal:"Drag (vacío=global)", fuelRegenMult:"× Regen fuel", maxMissiles:"Máx misiles",
  missileCooldown:"Cooldown misil", radarSignature:"Firma radar", maxFlares:"Bengalas (por vida)",
  maxShield:"Escudo máx", shieldRegenRate:"Regen escudo/s", shieldRegenDelay:"Retardo regen (s)",
  crewCapacity:"Tripulación", bulletDamage:"Daño cañón", torpedo:"Dispara torpedos",
};

let cfg = {};
const SHIP_KEYS = ["interceptor","fighter","bomber","gunship","capital","emp"];

async function load() {
  try { cfg = await fetch("/config").then(r => r.json()); render(); }
  catch (e) { status("err", "Error al cargar la configuración"); }
}

function fieldRow(id, label, value, unit, kind = "number") {
  const d = document.createElement("div");
  d.className = "field";
  if (kind === "bool") {
    d.innerHTML = `<label>${label}</label>
      <input type="checkbox" id="${id}" ${value ? "checked" : ""}>
      <span class="unit">${unit || ""}</span>`;
  } else if (kind === "text") {
    d.innerHTML = `<label>${label}</label>
      <input type="text" class="wide" id="${id}" value="${(value ?? "").toString().replace(/"/g,"&quot;")}">
      <span class="unit">${unit || ""}</span>`;
  } else {
    d.innerHTML = `<label>${label}</label>
      <input type="number" step="any" id="${id}" value="${value ?? ""}">
      <span class="unit">${unit || ""}</span>`;
  }
  return d;
}

function render() {
  renderGeneral();
  renderShips();
  renderWaves();
  buildTabs();
}

function renderGeneral() {
  const wrap = document.getElementById("tabGeneral");
  wrap.innerHTML = "";
  const seen = new Set(["SHIP_TYPES", "WAVES", "save"]);
  for (const [groupName, fields] of GROUPS) {
    const g = document.createElement("div");
    g.className = "group";
    g.innerHTML = `<h2>${groupName}</h2>`;
    for (const [key, [label, unit]] of Object.entries(fields)) {
      if (!(key in cfg)) continue;
      seen.add(key);
      g.appendChild(fieldRow("f_" + key, label, cfg[key], unit));
    }
    wrap.appendChild(g);
  }
  // Catch-all: cualquier escalar restante (number/boolean/string) → todo editable
  const extras = Object.keys(cfg).filter(k =>
    !seen.has(k) && ["number","boolean","string"].includes(typeof cfg[k]));
  if (extras.length) {
    const g = document.createElement("div");
    g.className = "group";
    g.innerHTML = `<h2>Otras variables</h2>`;
    for (const key of extras) {
      const t = typeof cfg[key];
      g.appendChild(fieldRow("f_" + key, key, cfg[key], "",
        t === "boolean" ? "bool" : t === "string" ? "text" : "number"));
    }
    wrap.appendChild(g);
  }
}

function renderShips() {
  const wrap = document.getElementById("tabShips");
  wrap.innerHTML = `<div class="note">Edita cualquier estadística de cada nave. La cápsula de colisión define el casco (proa/popa/semianchura).</div>`;
  const ships = cfg.SHIP_TYPES || {};
  for (const type of Object.keys(ships)) {
    const ship = ships[type];
    const card = document.createElement("div");
    card.className = "shipcard";
    card.innerHTML = `<h3>${(ship.label || type).toUpperCase()} <span style="color:#445">(${type})</span></h3>`;
    const cols = document.createElement("div");
    cols.className = "cols";
    for (const key of Object.keys(ship)) {
      const val = ship[key];
      const label = SHIP_FIELD_LABELS[key] || key;
      const id = `ship_${type}_${key}`;
      if (key === "collider" && val && typeof val === "object") {
        cols.appendChild(fieldRow(`${id}_front`, "Casco proa (front)", val.front, "px"));
        cols.appendChild(fieldRow(`${id}_rear`, "Casco popa (rear)", val.rear, "px"));
        cols.appendChild(fieldRow(`${id}_radius`, "Casco semianchura", val.radius, "px"));
      } else if (typeof val === "boolean") {
        cols.appendChild(fieldRow(id, label, val, "", "bool"));
      } else if (typeof val === "string") {
        cols.appendChild(fieldRow(id, label, val, "", "text"));
      } else if (typeof val === "number" || val === null) {
        cols.appendChild(fieldRow(id, label, val, "", "number"));
      }
      // arrays/objetos complejos (turretHardpoints) se preservan sin editar
    }
    card.appendChild(cols);
    wrap.appendChild(card);
  }
}

function renderWaves() {
  const wrap = document.getElementById("tabWaves");
  wrap.innerHTML = `<div class="note">Cada oleada es una lista de naves enemigas separadas por comas. Tipos válidos: ${SHIP_KEYS.join(", ")}. Marca "Jefe" en la oleada con nave Capital.</div>`;
  const list = document.createElement("div");
  list.id = "wavesList";
  wrap.appendChild(list);
  const addBtn = document.createElement("button");
  addBtn.textContent = "+ Añadir oleada";
  addBtn.className = "secondary";
  addBtn.onclick = () => { (cfg.WAVES = cfg.WAVES || []).push({ ships: ["fighter"], boss: false }); drawWaves(); };
  wrap.appendChild(addBtn);
  drawWaves();
}

function drawWaves() {
  const list = document.getElementById("wavesList");
  list.innerHTML = "";
  (cfg.WAVES || []).forEach((w, i) => {
    const row = document.createElement("div");
    row.className = "wave";
    row.innerHTML = `
      <span class="wlabel">OLEADA ${i + 1}</span>
      <input type="text" id="wave_${i}" value="${(w.ships || []).join(", ")}">
      <label class="boss"><input type="checkbox" id="waveboss_${i}" ${w.boss ? "checked" : ""}> Jefe</label>
      <button class="del" data-i="${i}">✕</button>`;
    row.querySelector(".del").onclick = () => {
      syncWavesFromDom();
      cfg.WAVES.splice(i, 1);
      drawWaves();
    };
    list.appendChild(row);
  });
}

function syncWavesFromDom() {
  (cfg.WAVES || []).forEach((w, i) => {
    const t = document.getElementById("wave_" + i);
    const b = document.getElementById("waveboss_" + i);
    if (t) w.ships = t.value.split(",").map(s => s.trim()).filter(Boolean);
    if (b) w.boss = b.checked;
  });
}

function buildTabs() {
  const bar = document.getElementById("tabbar");
  bar.innerHTML = "";
  const tabs = [["General", "tabGeneral"], ["Naves", "tabShips"], ["Oleadas", "tabWaves"]];
  for (const [name, id] of tabs) {
    const b = document.createElement("button");
    b.textContent = name;
    if (id === "tabGeneral") b.classList.add("active");
    b.onclick = () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".tabbar button").forEach(t => t.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      b.classList.add("active");
    };
    bar.appendChild(b);
  }
}

function readInput(id) {
  const el = document.getElementById(id);
  if (!el) return undefined;
  if (el.type === "checkbox") return el.checked;
  if (el.type === "text") return el.value;
  if (el.value === "") return null;        // p.ej. dragVal vacío → null (usa global)
  return parseFloat(el.value);
}

function collectValues() {
  const updates = {};
  // Escalares de General
  for (const [, fields] of GROUPS)
    for (const key of Object.keys(fields))
      if (document.getElementById("f_" + key)) {
        const v = readInput("f_" + key);
        if (v !== undefined) updates[key] = v;
      }
  // Catch-all extras
  for (const key of Object.keys(cfg)) {
    if (["SHIP_TYPES","WAVES"].includes(key)) continue;
    if (document.getElementById("f_" + key) && !(key in updates)) {
      const v = readInput("f_" + key);
      if (v !== undefined) updates[key] = v;
    }
  }
  // Naves — clon profundo y sobre-escritura de los campos renderizados (preserva turretHardpoints)
  const ships = JSON.parse(JSON.stringify(cfg.SHIP_TYPES || {}));
  for (const type of Object.keys(ships)) {
    const ship = ships[type];
    for (const key of Object.keys(ship)) {
      if (key === "collider" && ship[key] && typeof ship[key] === "object") {
        const f = readInput(`ship_${type}_collider_front`);
        const r = readInput(`ship_${type}_collider_rear`);
        const rad = readInput(`ship_${type}_collider_radius`);
        if (f !== undefined) ship.collider.front = f;
        if (r !== undefined) ship.collider.rear = r;
        if (rad !== undefined) ship.collider.radius = rad;
        continue;
      }
      const v = readInput(`ship_${type}_${key}`);
      if (v !== undefined) ship[key] = v;
    }
  }
  updates.SHIP_TYPES = ships;
  // Oleadas
  syncWavesFromDom();
  updates.WAVES = cfg.WAVES || [];
  return updates;
}

async function post(data) {
  const r = await fetch("/config", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error();
}

function status(type, msg) {
  const el = document.getElementById("status");
  el.innerHTML = `<span class="${type}">${msg}</span>`;
  setTimeout(() => el.innerHTML = "", 3000);
}

document.getElementById("save").addEventListener("click", async () => {
  try { await post(collectValues()); cfg = await fetch("/config").then(r => r.json()); status("ok", "✓ Guardado correctamente"); }
  catch (e) { status("err", "✗ Error al guardar"); }
});

document.getElementById("reset").addEventListener("click", async () => {
  if (!confirm("¿Resetear TODOS los valores a los defaults?")) return;
  try { await post({ __reset: true }); cfg = await fetch("/config").then(r => r.json()); render(); status("ok", "✓ Valores reseteados"); }
  catch (e) { status("err", "✗ Error"); }
});

load();
</script>
</body>
</html>
