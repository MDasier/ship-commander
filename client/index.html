<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Ship Commander</title>
</head>

<body>

  <!-- ── MENU ── contenedor legacy vestigial: toda la UI está migrada a React
       (client/src/ui/*). game.js (showMenuScreen) aún alterna su display, por eso
       se conserva el #menu vacío y oculto. -->
  <div id="menu" style="display:none">

    <!-- ── MENÚ PRINCIPAL ── (migrado a React: client/src/ui/MainMenu.tsx,
         renderizado en la ruta "/" por App.tsx) -->

    <!-- ── BUSCAR PARTIDAS ── migrada a React: client/src/ui/CoopRooms.tsx
         (ruta "/lobby"), abierta por menuPlayOnline() desde game.js. -->

    <!-- ── PRÁCTICA EN SOLITARIO ── migrada a React: client/src/ui/FlySolo.tsx
         (ruta "/solo"), arrancada por menuSolo() desde game.js. -->

    <!-- ── CONTROLES ── (migrada a React: client/src/ui/ControlsScreen.tsx,
         abierta vía CustomEvent "open-controls" emitido por game.js) -->

    <!-- ── SALA / LOBBY CON EQUIPOS ── migrada a React: client/src/ui/Room.tsx
         (ruta "/room"), abierta al unirse/crear sala desde game.js. -->

  </div>

  <!-- ── HUD ── migrado a React: client/src/ui/Hud.tsx (ruta "/game").
       game.js sigue escribiendo los valores por id (updateHUD/updateTimer)
       cada frame; React solo renderiza la estructura. -->

  <!-- ── PANEL NAVE AL MORIR ── migrado a React: client/src/ui/DeadPanel.tsx
       (evento "dead" desde game.js). -->

  <!-- ── MOBIGLASS ── migrado a React: client/src/ui/MobiGlass.tsx, montado por
       App.tsx al recibir el evento "mobi" desde game.js (F1). -->

  <!-- ── GAME OVER ── migrado a React: client/src/ui/GameOver.tsx (evento
       "gameover"). El texto VICTORIA/DERROTA y el marcador van en el canvas. -->

  <!-- ── CHAT ── migrado a React: client/src/ui/ChatInput.tsx (evento "chat").
       El LOG de mensajes se dibuja en el canvas (game.js). -->

  <!-- ── CONEXIÓN PERDIDA ── migrada a React: client/src/ui/Reconnect.tsx,
       montada por App.tsx al recibir el evento "conn-lost" desde game.js. -->

  <!-- ── ARRANQUE / DESPERTAR DEL SERVIDOR ── migrado a React: client/src/ui/Boot.tsx
       (evento "boot" desde game.js/net.ts). -->

  <!-- ── CANVAS ── -->
  <canvas id="c"></canvas>

  <!-- Raíz de React. El markup del juego (arriba) se migra a componentes React
       de forma incremental (strangler); por ahora React monta aquí su UI propia,
       todavía vacía, mientras game.js sigue usando el markup existente. -->
  <div id="root"></div>

  <!-- Punto de entrada: React monta en #root y arranca el juego (importa game.js). -->
  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
